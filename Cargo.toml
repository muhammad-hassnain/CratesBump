[package]
name = "semver-ml"
version = "0.1.0"
edition = "2021"
description = "Release-pair feature extractor behind the CratesBump SemVer dataset for crates.io, inspired by arXiv:2204.05929"
license = "MIT"
repository = "https://github.com/muhammad-hassnain/CratesBump"

[dependencies]
csv        = "1.3"
serde      = { version = "1", features = ["derive"] }
thiserror  = "1"
# Feature extraction
ureq       = { version = "2", features = ["json"] }
serde_json = "1"
syn        = { version = "2", features = ["full", "visit", "extra-traits"] }
toml       = "0.8"
chrono     = { version = "0.4", features = ["serde"] }
tempfile   = "3"
walkdir    = "2"
